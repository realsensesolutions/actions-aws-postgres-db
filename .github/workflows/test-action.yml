name: Test Action

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  region: us-east-1

jobs:
  test:
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        instance:
          - name: dsql-test-alpha
            deletion_protection: 'false'
            create_iam_role: 'true'
          - name: dsql-test-beta
            deletion_protection: 'false'
            create_iam_role: 'true'
          - name: dsql-test-gamma
            deletion_protection: 'false'
            create_iam_role: 'false'

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.region }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ${{ github.repository_owner }}-${{ github.actor }}-${{ matrix.instance.name }}

      - name: Setup Terraform Backend
        uses: alonch/actions-aws-backend-setup@main
        with:
          instance: ${{ matrix.instance.name }}

      - name: Deploy DSQL Cluster - ${{ matrix.instance.name }}
        uses: ./
        id: dsql
        with:
          name: ${{ matrix.instance.name }}
          action: apply
          deletion_protection_enabled: ${{ matrix.instance.deletion_protection }}
          create_iam_role: ${{ matrix.instance.create_iam_role }}

      - name: Display Outputs - ${{ matrix.instance.name }}
        run: |
          echo "=== DSQL Cluster: ${{ matrix.instance.name }} ==="
          echo "Cluster ARN: ${{ steps.dsql.outputs.cluster_arn }}"
          echo "Cluster ID: ${{ steps.dsql.outputs.cluster_id }}"
          echo "Cluster Endpoint: ${{ steps.dsql.outputs.cluster_endpoint }}"
          echo "VPC Endpoint Service Name: ${{ steps.dsql.outputs.vpc_endpoint_service_name }}"
          echo "IAM Role ARN: ${{ steps.dsql.outputs.iam_role_arn }}"
          echo "Region: ${{ steps.dsql.outputs.region }}"

      - name: Test Connection - ${{ matrix.instance.name }}
        run: |
          echo "Generating DSQL auth token for ${{ matrix.instance.name }}..."
          TOKEN=$(aws dsql generate-db-connect-admin-auth-token \
            --hostname ${{ steps.dsql.outputs.cluster_endpoint }} \
            --region ${{ env.region }})
          
          if [ -n "$TOKEN" ]; then
            echo "✓ Auth token generated successfully for ${{ matrix.instance.name }}"
          else
            echo "✗ Failed to generate auth token for ${{ matrix.instance.name }}"
            exit 1
          fi

      # - name: Cleanup - Destroy ${{ matrix.instance.name }}
      #   if: always()
      #   uses: ./
      #   with:
      #     name: ${{ matrix.instance.name }}
      #     action: destroy
      #     deletion_protection_enabled: 'false'
