name: Test Action

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  region: us-east-1

jobs:
  test:
    permissions:
      id-token: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.region }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: ${{ github.repository_owner }}-${{ github.actor }}

      - name: Setup Terraform Backend
        uses: alonch/actions-aws-backend-setup@main
        id: backend
        with:
          instance: test-dsql-action

      - name: Deploy DSQL Cluster
        uses: ./
        id: dsql
        with:
          name: test-dsql-cluster
          action: apply
          deletion_protection_enabled: 'false'
          create_iam_role: 'true'

      - name: Display Outputs
        run: |
          echo "=== DSQL Cluster Outputs ==="
          echo "Cluster ARN: ${{ steps.dsql.outputs.cluster_arn }}"
          echo "Cluster ID: ${{ steps.dsql.outputs.cluster_id }}"
          echo "Cluster Endpoint: ${{ steps.dsql.outputs.cluster_endpoint }}"
          echo "VPC Endpoint Service Name: ${{ steps.dsql.outputs.vpc_endpoint_service_name }}"
          echo "IAM Role ARN: ${{ steps.dsql.outputs.iam_role_arn }}"
          echo "Region: ${{ steps.dsql.outputs.region }}"
          echo ""
          echo "=== Environment Variables ==="
          echo "TF_VAR_dsql_cluster_endpoint: $TF_VAR_dsql_cluster_endpoint"

      - name: Test Connection (Auth Token)
        run: |
          echo "Generating DSQL auth token..."
          TOKEN=$(aws dsql generate-db-connect-admin-auth-token \
            --hostname ${{ steps.dsql.outputs.cluster_endpoint }} \
            --region ${{ env.region }})
          
          if [ -n "$TOKEN" ]; then
            echo "✓ Auth token generated successfully"
          else
            echo "✗ Failed to generate auth token"
            exit 1
          fi

      - name: Cleanup - Destroy Cluster
        if: always()
        uses: ./
        with:
          name: test-dsql-cluster
          action: destroy
          deletion_protection_enabled: 'false'
